<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {

    -webkit-font-smoothing: antialiased;
  }

  main { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; z-index: 2; }

  .screen { display: none; width: 100%; max-width: 560px; text-align: center; animation: aparecer 1s ease; }
  .screen.activa { display: block; }

  @keyframes aparecer { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .kicker { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; color: #d77b9f; margin-bottom: 18px; }

  h1 { font-weight: normal; font-size: clamp(30px, 7vw, 46px); line-height: 1.2; margin-bottom: 40px; }
  h1 span { color: #d77b9f; font-style: italic; }

  h2 { font-weight: normal; font-size: clamp(30px, 7vw, 42px); margin-bottom: 14px; }

  .botones { display: flex; gap: 18px; justify-content: center; align-items: center; min-height: 70px; }

  button, .btn {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-radius: 40px;
    padding: 15px 42px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: transform .2s ease, background .2s ease;
  }

  .btn-si { background: #f4b6cf; color: #111; border: none; box-shadow: 0 8px 24px rgba(215,123,159,.35); }
  .btn-si:hover { transform: scale(1.05); background: #efa3c2; }

  .btn-no { background: #fff; color: #111; border: 1px solid #111; position: relative; }

  .btn-spotify { background: #111; color: #fff; border: none; margin: 10px 0 36px; }
  .btn-spotify:hover { background: #333; }

  .msg-preparado { font-size: 20px; color: #333; margin-bottom: 8px; }

  /* Lista de canciones */
  .lista { text-align: left; margin-top: 10px; }

  .cancion {
    background: rgba(255,255,255,.85);
    border: 1px solid #f4cfdf;
    border-radius: 18px;
    margin-bottom: 16px;
    padding: 20px;
    box-shadow: 0 4px 12px rgba(215,123,159,.08);
  }

  .cabecera-info { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .numero { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 11px; color: #d77b9f; letter-spacing: 2px; font-weight: bold; }
  .titulo { font-size: 20px; color: #111; font-weight: normal; }
  .artista { font-size: 14px; color: #666; font-style: italic; }

  .acciones { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }

  .btn-mensaje {
    background: #fdf0f5;
    color: #d77b9f;
    border: 1px solid #f4cfdf;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: none;
    box-shadow: none;
  }
  .btn-mensaje:hover { background: #f9dce8; transform: none; }

  .youtube {
    display: inline-block;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    color: #111;
    text-decoration: none;
    border-bottom: 1px solid #d77b9f;
    padding-bottom: 2px;
  }

  .mensaje-desplegable {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .4s ease;
  }
  .mensaje-desplegable.abierto { grid-template-rows: 1fr; }
  .mensaje-desplegable > div { overflow: hidden; }
  
  .mensaje-texto {
    margin-top: 14px;
    padding: 16px;
    background: #fff;
    border-left: 3px solid #d77b9f;
    border-radius: 0 12px 12px 0;
    font-size: 15px;
    line-height: 1.8;
    color: #444;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .firma { margin-top: 40px; font-style: italic; color: #d77b9f; font-size: 17px; }

  /* Corazones flotantes */
  .corazon { position: fixed; bottom: -40px; color: #f4b6cf; pointer-events: none; z-index: 1; animation: subir linear forwards; }
  @keyframes subir { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }

  @media (max-width: 480px) {
    .botones { flex-direction: column; gap: 14px; }
    .btn-no, .btn-si { width: 200px; }
  }
</style>

  <!-- PANTALLA 1: LA PREGUNTA -->

    </div>
  </section>

  <!-- PANTALLA 2: RESPUESTA SÍ -->
  <section id="respuesta" class="screen">
    <h2>Bien ahí 💗</h2>
    <p class="te-amo">te amo mi amor</p>
    <div id="contenido" style="display:none;">
      <p class="msg-preparado">Preparé esto para vos bombón, todo y solo para vos</p>
      <a id="spotify" class="btn btn-spotify" href="#" target="_blank" rel="noopener">Escuchar en Spotify</a>
      <div id="lista" class="lista"></div>
      <p class="firma">Con todo mi cariño<br>Gracias por fumarme, mi amor<br>Te amo ❤️</p>
      <p class="nota-traducciones">Las traducciones las hice yo jajajaj, disculpá si hay algún error (lo dudo mucho porque soy un crack).</p>
    </div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const si = $("si");
  const no = $("no");

  /* ---------- BOTÓN NO: SE ESCAPA ---------- */
  const frases = ["¿Segura?", "Pensalo otra vez", "Mira que te espero", "Nope 🙃", "Casi, casi..."];
  let fraseIndex = 0;

  function huir() {
    no.style.position = "fixed";
    const w = no.offsetWidth;
    const h = no.offsetHeight;
    const x = Math.random() * (window.innerWidth - w - 24) + 12;
    const y = Math.random() * (window.innerHeight - h - 24) + 12;
    no.style.left = x + "px";
    no.style.top = y + "px";
    no.textContent = frases[fraseIndex % frases.length];
    fraseIndex++;
  }

  no.addEventListener("mouseenter", huir);
  no.addEventListener("touchstart", (e) => { e.preventDefault(); huir(); }, { passive: false });
  no.addEventListener("click", (e) => { e.preventDefault(); huir(); });

  /* ---------- BOTÓN SÍ ---------- */
  si.addEventListener("click", () => {
    $("pregunta").classList.remove("activa");
    $("respuesta").classList.add("activa");
    lanzarCorazones(40);

    setTimeout(() => {
      $("contenido").style.display = "block";
      armarPlaylist();
      armarLista();
    }, 2200);
  });

  function armarPlaylist() {
    $("spotify").href = CONFIG.spotifyPlaylist;
  }

  function armarLista() {
    const cont = $("lista");
    CONFIG.canciones.forEach((c, i) => {
      const card = document.createElement("div");
      card.className = "cancion";

      // Encabezado con información
      const info = document.createElement("div");
      info.className = "cabecera-info";
      info.innerHTML = `
        <div class="numero">${String(i + 1).padStart(2, "0")}</div>
        <div class="titulo"></div>
        <div class="artista"></div>
      `;
      info.querySelector(".titulo").textContent = c.titulo;
      info.querySelector(".artista").textContent = c.artista;

      // Botones de acción
      const acciones = document.createElement("div");
      acciones.className = "acciones";

      const btnMsg = document.createElement("button");
      btnMsg.className = "btn-mensaje";
      btnMsg.textContent = "💌 Leer mi mensaje";

      acciones.appendChild(btnMsg);

      if (c.youtube && c.youtube.trim() !== "") {
        const yt = document.createElement("a");
        yt.className = "youtube";
        yt.href = c.youtube;
        yt.target = "_blank";
        yt.rel = "noopener";
        yt.textContent = "▶ YouTube";
        acciones.appendChild(yt);
      }

      // Panel desplegable del mensaje
      const despl = document.createElement("div");
      despl.className = "mensaje-desplegable";

      const inner = document.createElement("div");
      const texto = document.createElement("div");
      texto.className = "mensaje-texto";
      
      // Limpiamos el texto para no mostrar la línea de comentario del desarrollador
      const textoLimpio = c.letra.replace("// ESCRIBE TU COMENTARIO ROMÁNTICO AQUÍ\n", "");
      texto.textContent = textoLimpio;

      inner.appendChild(texto);
      despl.appendChild(inner);

      // Evento del botón para abrir/cerrar mensaje
      btnMsg.addEventListener("click", () => {
        const abierto = despl.classList.toggle("abierto");
        btnMsg.textContent = abierto ? "Ocultar mensaje" : "💌 Leer mi mensaje";
      });

      card.appendChild(info);
      card.appendChild(acciones);
      card.appendChild(despl);

      cont.appendChild(card);
    });
  }

  /* ---------- CORAZONES ---------- */
  function lanzarCorazones(n) {
    for (let i = 0; i < n; i++) {
      setTimeout(() => {
        const c = document.createElement("span");
        c.className = "corazon";
        c.textContent = "♥";
        c.style.left = Math.random() * 100 + "vw";
        c.style.fontSize = (12 + Math.random() * 22) + "px";
        const dur = 4 + Math.random() * 4;
        c.style.animationDuration = dur + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), dur * 1000);
      }, i * 120);
    }
  }
</script>

</body>
